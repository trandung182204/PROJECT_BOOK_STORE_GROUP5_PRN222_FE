<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Koparion • Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- SweetAlert2 + Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Lora:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ---- STYLE BẢNG ---- */
      #paymentTable {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }

      #paymentTable th,
      #paymentTable td {
        border: 1px solid #ddd; /* viền mảnh nhẹ */
        padding: 10px; /* khoảng cách trong ô */
        text-align: center; /* căn giữa chữ */
        vertical-align: middle; /* căn giữa theo chiều dọc */
      }

      #paymentTable th {
        background-color: #f1962f; /* màu nền tiêu đề */
        color: white;
        font-weight: bold;
      }

      #paymentTable tr:nth-child(even) {
        background-color: #f9f9f9; /* xen kẽ màu hàng */
      }

      #paymentTable tr:hover {
        background-color: #f1f1f1; /* hover nhẹ */
      }

      h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #333;
      }
      :root {
        --kop-primary: #f1962f;
        --kop-dark: #111;
        --kop-muted: #6b7280;
        --radius: 18px;
        --sidebar-w: 260px;
      }
      body {
        background: #f8fafc;
        font-family: Montserrat, system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial;
      }

      /* Topbar */
      .kop-topbar {
        background: var(--kop-dark);
        color: #fff;
        border-bottom: 4px solid var(--kop-primary);
      }
      .kop-brand {
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .kop-pill {
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-weight: 600;
        background: var(--kop-primary);
        color: #222;
        border: 0;
      }

      /* Sidebar (offcanvas) */
      #sidebar {
        --bs-offcanvas-width: var(--sidebar-w);
      }
      #sidebar .offcanvas-header {
        border-bottom: 1px solid #eee;
      }
      #sidebar .nav-link {
        border-radius: 10px;
        font-weight: 600;
        color: #374151;
        padding: 0.55rem 0.75rem;
      }
      #sidebar .nav-link:hover {
        background: #f3f4f6;
        color: #111;
      }
      #sidebar .nav-link.active {
        background: rgba(241, 150, 47, 0.16);
        color: #111;
      }
      #sidebar .nav-link i {
        width: 22px;
        text-align: center;
        margin-right: 0.4rem;
        color: #f1962f;
      }

      /* Layout khi >= lg */
      @media (min-width: 992px) {
        .admin-wrap {
          display: flex;
        }
        /* FIX: ép offcanvas thành sidebar sticky luôn hiển thị */
        #sidebar.offcanvas-lg {
          transform: none !important;
          visibility: visible !important;
          position: sticky;
          top: 0;
          height: 100dvh;
          width: var(--sidebar-w);
          flex: 0 0 var(--sidebar-w);
          border-right: 1px solid #eee;
        }
        .content {
          flex: 1;
          padding: 1.25rem 1rem;
        }
        .offcanvas-backdrop {
          display: none !important;
        }
      }

      /* Cards */
      .kop-card {
        border: 0;
        border-radius: var(--radius);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        transition: 0.15s ease;
      }
      .kop-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      }
      .kop-card .card-header {
        background: #fff;
        border: 0;
        padding: 1rem 1.25rem 0 1.25rem;
        font-weight: 700;
        color: #111;
      }

      /* KPI */
      .kpi-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(241, 150, 47, 0.14);
        color: var(--kop-primary);
        font-size: 1.2rem;
        flex: 0 0 auto;
      }
      .kpi-value {
        font-size: 1.9rem;
        font-weight: 800;
        line-height: 1.05;
        color: #111;
        white-space: nowrap;
        letter-spacing: -0.3px;
        margin-top: 0.35rem;
      }
      .kpi-title {
        color: var(--kop-muted);
        font-size: 0.92rem;
      }
      .kop-badge {
        background: rgba(17, 17, 17, 0.04);
        padding: 0.35rem 0.6rem;
        border-radius: 8px;
        font-size: 0.8rem;
      }
      .mini-help {
        font-size: 0.82rem;
        color: var(--kop-muted);
      }
      .kop-footer {
        color: #9ca3af;
      }

      /* Tables */
      .table > thead th {
        color: #111;
        font-weight: 700;
        border-bottom: 2px solid #eef2f7;
      }
      .table > tbody td {
        vertical-align: middle;
      }
      .table td.money,
      .table th.money {
        text-align: right;
        white-space: nowrap;
      }

      /* Buttons / Filters */
      .btn-kop {
        background: var(--kop-primary);
        color: #222;
        border: none;
        font-weight: 700;
      }
      .btn-kop:hover {
        filter: brightness(0.95);
        color: #111;
      }
      .filter-chip {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 0.4rem 0.7rem;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Topbar -->
    <header class="kop-topbar py-2">
      <div
        class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-2"
      >
        <div class="d-flex align-items-center gap-3">
          <!-- Hamburger (mobile) -->
          <button
            class="btn btn-sm btn-outline-light d-lg-none"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar"
            aria-controls="sidebar"
          >
            <i class="bi bi-list"></i>
          </button>
          <span class="kop-brand"
            ><i class="bi bi-graph-up-arrow me-2 text-warning"></i>Admin
            Dashboard</span
          >
          <span class="kop-badge d-none d-md-inline">Book Store</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <a
            href="index.html"
            class="kop-pill text-decoration-none d-none d-sm-inline"
            ><i class="bi bi-house-door me-1"></i> Back to Shop</a
          >
        </div>
      </div>
    </header>

    <div class="admin-wrap">
      <!-- SIDEBAR -->
      <aside
        class="offcanvas offcanvas-start offcanvas-lg"
        tabindex="-1"
        id="sidebar"
        aria-labelledby="sidebarLabel"
        data-bs-scroll="true"
        data-bs-backdrop="false"
      >
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="sidebarLabel">
            <i class="bi bi-speedometer2 me-2 text-warning"></i>Admin Menu
          </h5>
          <button
            type="button"
            class="btn-close d-lg-none"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div class="offcanvas-body">
          <nav class="nav flex-column gap-1">
            <a id="nav-dashboard" class="nav-link active" href="admin.html"
              ><i class="bi bi-grid-1x2"></i> Dashboard</a
            >
            <div class="mt-2 mb-1 small text-uppercase text-muted">Manage</div>
            <a id="nav-books" class="nav-link" href="admin-books.html"
              ><i class="bi bi-book"></i> Books</a
            >
            <a id="nav-users" class="nav-link" href="admin-users.html"
              ><i class="bi bi-people"></i> Users</a
            >
            <a id="nav-orders" class="nav-link" href="admin-orders.html"
              ><i class="bi bi-bag-check"></i> Orders</a
            >
            <a id="nav-categories" class="nav-link" href="admin-categories.html"
              ><i class="bi bi-tags"></i> Categories</a
            >
            <a id="nav-reviews" class="nav-link" href="admin-reviews.html"
              ><i class="bi bi-chat-dots"></i> Reviews</a
            >
            <div class="mt-3 mb-1 small text-uppercase text-muted">
              Analytics
            </div>
            <a id="nav-reports" class="nav-link" href="admin-payment.html"
              ><i class="bi bi-graph-up"></i> Reports</a
            >
            <a id="nav-deleted" class="nav-link" href="#deleted-section"
              ><i class="bi bi-archive"></i> Deleted / Restore</a
            >
            <div class="mt-3 mb-1 small text-uppercase text-muted">System</div>
            <a id="nav-settings" class="nav-link" href="admin-settings.html"
              ><i class="bi bi-gear"></i> Settings</a
            >
            <a class="nav-link" href="login.html" id="logout-link"
              ><i class="bi bi-box-arrow-right"></i> Sign out</a
            >
          </nav>
        </div>
      </aside>
      <main class="content container-fluid">
        <section class="mb-5">
          <div class="kop-card card">
            <div class="card-header">
              <div
                class="d-flex justify-content-between align-items-center flex-wrap gap-3"
              >
                <div class="d-flex align-items-center gap-2">
                  <h4 class="m-0">Payment Report</h4>
                </div>
                <div class="d-flex gap-2 align-items-center">
                  <select
                    id="typeSel"
                    class="form-select form-select-sm"
                    style="width: 150px"
                  >
                    <option value="" selected>Select method</option>
                    <option value="COD">COD</option>
                    <option value="VNPAY">VNPAY</option>
                  </select>
                  <select
                    id="typeSel"
                    class="form-select form-select-sm"
                    style="width: 150px"
                  >
                    <option value="" selected>Select time</option>
                    <option value="day">By day</option>
                    <option value="month">By month</option>
                  </select>
                  <input
                    id="fromDate"
                    type="date"
                    class="form-control form-control-sm"
                  />
                  <span class="text-muted">–</span>
                  <input
                    id="toDate"
                    type="date"
                    class="form-control form-control-sm"
                  />
                  <button class="btn btn-kop btn-sm" onclick="loadPayment()">
                    <i class="bi bi-funnel me-1"></i>Filter
                  </button>
                </div>
              </div>
            </div>
            <div class="card-body">
              <h2>Danh sách giao dịch</h2>
              <table border="1" width="100%" id="paymentTable">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Đơn hàng</th>
                    <th>Tên khách hàng</th>
                    <th>Phương thức</th>
                    <th>Trạng thái</th>
                    <th>Thời gian trả</th>
                    <th>Tổng tiền (VNĐ)</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ================== JS ================== -->
    <script>
      /* ------- CONFIG ------- */
      let API_BASE = "http://localhost:5282/api/payment";
      let JWT_TOKEN = localStorage.getItem("token");
      async function fetchJSON(url, options = {}) {
        const headers = options.headers || {};
        headers["Content-Type"] = "application/json";
        if (JWT_TOKEN) headers["Authorization"] = "Bearer " + JWT_TOKEN;
        const res = await fetch(url, { ...options, headers });
        if (!res.ok) {
          throw new Error((await res.text()) || res.statusText);
        }
        return res.json();
      }

      async function loadPayment() {
        try {
          const type = document.getElementById("typeSel").value || null;
          const from = document.getElementById("fromDate").value || null;
          const to = document.getElementById("toDate").value || null;

          const url = new URL(`${API_BASE}`);
          if (type) url.searchParams.set("type", type);
          if (from) url.searchParams.set("from", from);
          if (to) url.searchParams.set("to", to);

          const data = await fetchJSON(url.toString());
          const payments = data.data || [];
          const tbody = document.querySelector("#paymentTable tbody");
          tbody.innerHTML = "";

          for (const o of payments) {
            const tr = document.createElement("tr");
            const date = new Date(o.createdAt).toLocaleDateString("vi-VN");
            const updateButton =
              o.orderStatus === "SHIPPING"
                ? `<button class="btn btn-warning btn-sm" onclick="updateOrderStatus('${o.id}', '${o.orderStatus}')">Cập nhật</button>`
                : "";
            tr.innerHTML = `
                    <td>${o.id}</td>
                    <td>${o.order.id} </td>
                    <td>${o.order.user.fullName}</td>
                    <td>${o.paymentMethod}</td>
                    <td>${o.status}</td>
                    <td>${date}</td>
                    <td>${o.amount.toLocaleString("vi-VN")}</td>
                `;
            tbody.appendChild(tr);
          }
        } catch (e) {
          console.error(e);
          Swal.fire({
            icon: "error",
            title: "Lỗi tải payment",
            text: e.message,
            confirmButtonColor: "#f1962f",
          });
        }
      }
      loadPayment();
    </script>
    <script>
      // Guard vào trang admin
      (function guardAdminPage() {
        const token = localStorage.getItem("accessToken");
        if (!token) {
          location.href = "login.html";
          return;
        }
        function parseJwt(t) {
          try {
            return JSON.parse(atob(t.split(".")[1]));
          } catch (e) {
            return null;
          }
        }
        const payload = parseJwt(token);
        const roleClaim =
          payload?.role ||
          payload?.[
            "http://schemas.microsoft.com/ws/2008/06/identity/claims/role"
          ];
        const roles = Array.isArray(roleClaim)
          ? roleClaim
          : roleClaim
          ? [roleClaim]
          : [];

        if (!roles.includes("Admin")) {
          alert("Bạn không có quyền truy cập Admin");
          location.href = "index.html";
        } else {
          // ✔ gắn token đúng biến
          //jwtToken = token;
          // ✔ giờ mới load dữ liệu admin
          loadPayment();
        }
      })();
    </script>
    <script>
      document
        .getElementById("logout-link")
        ?.addEventListener("click", async (e) => {
          e.preventDefault();
          const refreshToken = localStorage.getItem("refreshToken");
          try {
            if (refreshToken) {
              await fetch("http://localhost:5282/api/Account/Logout", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ refreshToken }),
              });
            }
          } catch (err) {
            console.warn("Logout API error", err);
          }
          // Dù sao cũng clear token phía FE
          localStorage.removeItem("accessToken");
          localStorage.removeItem("refreshToken");
          window.location.href = "login.html";
        });
    </script>
    <!-- Bootstrap bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
